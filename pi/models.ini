; llama-server model presets (router mode), installed to /etc/pi-llm/models.ini
;
; Each [section] is one model. Its name is the model ID you pick in the web UI
; or send as "model" in API requests. Keys are llama-server CLI flags without
; the leading dashes. After editing, run:  sudo systemctl restart pi-llm
;
; The server keeps only ONE model in RAM at a time (--models-max 1 in the
; systemd unit). Selecting the other model unloads the current one first, then
; loads the new one: seconds from an NVMe SSD, up to a minute from a microSD card.

version = 1

; ---------------------------------------------------------------------------
; Settings shared by all models
; ---------------------------------------------------------------------------
[*]
; The Pi 5 has 4 Cortex-A76 cores. Try 3 if you run other services on the Pi.
threads    = 4

; Context window in tokens, shared by all parallel conversations.
; Gemma 4 uses sliding-window attention, so its KV cache is small: 16K costs
; ~110 MB (E2B) / ~300 MB (E4B). The real limit on a Pi is time: prompt
; processing runs at tens of tokens/s, so filling 16K from scratch takes minutes.
; Ongoing chats are fast because the server caches the already-processed prompt.
ctx-size   = 16384

; Two conversations can generate at the same time (for example two family
; members). Token generation is memory-bandwidth bound, so two streams cost
; little more than one.
parallel   = 2
kv-unified = true

; Host-RAM prompt cache. The default (8 GiB) is the Pi's entire RAM, so cap it.
cache-ram  = 1024

; Gemma 4 can "think" before answering. At Pi speeds that adds about a minute
; to every reply, so it is off by default. The web UI has a per-chat toggle,
; and API clients can opt in per request with
;   "chat_template_kwargs": {"enable_thinking": true}
reasoning  = off

; Sampling settings recommended by Google for Gemma 4 (generation_config.json).
; API requests can override them per call.
temp       = 1.0
top-k      = 64
top-p      = 0.95
min-p      = 0.0

; ---------------------------------------------------------------------------
; Gemma 4 E2B: ~2.8 GB, the fast one. Loaded when the service starts.
; ---------------------------------------------------------------------------
[gemma-4-e2b]
model           = /opt/pi-llm/models/gemma-4-E2B-it-Q4_0.gguf
; Vision encoder (send photos). Delete this line to save ~0.6 GB of RAM.
mmproj          = /opt/pi-llm/models/mmproj-gemma-4-E2B-it-Q8_0.gguf
load-on-startup = true
; Experimental: speculative decoding with Gemma's multi-token-prediction head.
; Can speed up generation; measure it with ./bench.sh before keeping it on.
; spec-type     = draft-mtp
; model-draft   = /opt/pi-llm/models/mtp-gemma-4-E2B-it-Q4_0.gguf

; ---------------------------------------------------------------------------
; Gemma 4 E4B: ~4.6 GB, smarter but about half the speed of E2B.
; ---------------------------------------------------------------------------
[gemma-4-e4b]
model           = /opt/pi-llm/models/gemma-4-E4B-it-Q4_0.gguf
mmproj          = /opt/pi-llm/models/mmproj-gemma-4-E4B-it-Q8_0.gguf
; spec-type     = draft-mtp
; model-draft   = /opt/pi-llm/models/mtp-gemma-4-E4B-it-Q4_0.gguf
